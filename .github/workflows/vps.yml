name: Phase 1 Leapfrog VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: vps-single-instance
  cancel-in-progress: false

jobs:
  Build-VPS:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub max limit is 6 hours (360m). We use 350m for safety.
    steps:
      - name: Checkout Repo (Loading saved files)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git for Auto-Backup
        run: |
          git config --global user.name "VPS Auto-Saver"
          git config --global user.email "vps@autosaver.com"
          git config --global pull.rebase true

      - name: Start SSHX VPS and Auto-Backup
        run: |
          # 1. Start the auto-backup loop in the background
          (
            while true; do
              sleep 300
              cd $GITHUB_WORKSPACE
              echo "=== Auto-backup at $(date -u) ==="
              
              # Pull remote changes first to avoid conflicts
              git pull --rebase --autostash origin HEAD 2>/dev/null || true
              
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "Auto-backup of VPS files at $(date -u)"
                git push origin HEAD || echo "Push failed, will retry next cycle."
              fi
            done
          ) &

          # 2. Install and run SSHX in the FOREGROUND
          # This keeps the step alive and prevents GitHub from killing the connection
          curl -sSf https://sshx.io/get | sh -s install
          
          echo "====================================="
          echo "STARTING SSHX VPS..."
          echo "YOUR SSHX LINK WILL APPEAR BELOW SHORTLY:"
          echo "====================================="
          
          sshx
